services:
  koodo-reader:
    image: ghcr.io/koodo-reader/koodo-reader:master
    container_name: koodo-reader
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    environment:
      - SERVER_USERNAME=admin
      - SERVER_PASSWORD=password
      - ENABLE_HTTP_SERVER=true
    volumes:
      - ./volumes/uploads:/app/uploads
